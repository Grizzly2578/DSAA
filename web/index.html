<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetBeans Cafe</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<header class="app-header">
    <div class="logo-container">
        <img src="/assets/images/logo.jpg" alt="NetBeans Cafe Logo" class="logo">
    </div>
    <nav>
        <ul id="main-nav" class="hidden">
            <li><a href="#" onclick="showSection('menu-section')" class="active" id="nav-menu">Menu</a></li>
            <li><a href="#" onclick="showSection('orders-section')" id="nav-orders">Order Queue</a></li>
            <li><button id="theme-toggle" class="btn btn-secondary theme-btn">🌙</button></li>
            <li><button onclick="logout()" class="btn btn-secondary" style="margin-left: 10px;">Logout</button></li>
        </ul>
    </nav>
</header>

<main class="app-main">
    <!-- Error/Success Messages -->
    <div id="toast-container" class="toast-container hidden">
        <span id="toast-message"></span>
    </div>

    <section id="login-section" class="active-section">
        <div class="card" style="max-width: 400px; margin: 2rem auto;">
            <h2 class="text-center" style="margin-bottom: 1rem;">Staff Portal</h2>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-user">Username</label>
                    <input type="text" id="login-user" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="login-pass">Password</label>
                    <input type="password" id="login-pass" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-full" style="margin-top: 1rem;">Login</button>
            </form>
            <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; opacity: 0.7;">
                <strong>Demo Accounts:</strong><br>
                Manager: admin / admin123<br>
                Barista: barista / coffee123
            </div>
        </div>
    </section>

    <!-- Menu Section -->
    <section id="menu-section" class="hidden-section">
        <div class="section-header">
            <h2>Our Menu</h2>
            <div class="action-buttons" style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;">
                <select id="sort-select" onchange="loadMenu()" style="padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.9rem; background: var(--card-bg); color: var(--text-color);">
                    <option value="default">Sort: Default (ID)</option>
                    <option value="price-asc">Sort: Price (Low to High)</option>
                    <option value="price-desc">Sort: Price (High to Low)</option>
                </select>

                <div style="display: flex; gap: 0.25rem; align-items: center;">
                    <input type="number" id="search-id" placeholder="Search ID..." style="padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px; max-width: 120px; font-size: 0.9rem;" onkeypress="if(event.key === 'Enter') searchItem()">
                    <button onclick="searchItem()" class="btn btn-secondary">🔍</button>
                </div>
                <button onclick="openManageModal()" class="btn btn-primary manager-only hidden">Add New Item</button>
                <button onclick="document.getElementById('search-id').value=''; loadMenu()" class="btn btn-secondary">Refresh Menu</button>
            </div>
        </div>

        <div id="menu-grid" class="grid-container">
            <!-- Menu items will be injected here via JS -->
            <div class="loading">Loading menu...</div>
        </div>
    </section>

    <!-- Orders Section -->
    <section id="orders-section" class="hidden-section">
        <div class="section-header">
            <h2>Current Order Queue</h2>
            <div class="action-buttons">
                <button onclick="fulfillNextOrder()" class="btn btn-primary">Fulfill Next Order</button>
                <button onclick="loadOrders()" class="btn btn-secondary">Refresh Queue</button>
            </div>
        </div>

        <div class="queue-container">
            <div class="queue-stats">
                <span>Pending Orders: <strong id="pending-count">0</strong></span>
            </div>

            <table class="data-table">
                <thead>
                <tr>
                    <th>Position</th>
                    <th>Item ID</th>
                    <th>Item Name</th>
                    <th>Customer Alias</th>
                    <th>Quantity</th>
                </tr>
                </thead>
                <tbody id="orders-table-body">
                <!-- Orders will be injected here via JS -->
                <tr>
                    <td colspan="5" class="text-center loading">Loading queue...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <!-- Order Modal -->
    <div id="order-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('order-modal')">&times;</span>
            <h3>Place Order</h3>
            <h4 id="modal-item-name"></h4>
            <p id="modal-item-price"></p>

            <form id="order-form" onsubmit="submitOrder(event)">
                <input type="hidden" id="order-item-id">

                <div class="form-group">
                    <label for="order-quantity">Quantity:</label>
                    <input type="number" id="order-quantity" min="1" max="99" value="1" required>
                    <label for="customer-alias">Customer Alias:</label>
                    <input type="text" id="customer-alias" required>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('order-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add to Queue</button>
                </div>
            </form>
        </div>
    </div>

    <div id="manage-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('manage-modal')">&times;</span>
            <h3 id="manage-title">Add Menu Item</h3>

            <form id="manage-form" onsubmit="submitManagedItem(event)">
                <input type="hidden" id="manage-mode" value="add">
                <div class="form-group">
                    <label for="manage-id">Item ID:</label>
                    <input type="number" id="manage-id" required>
                    <label for="manage-name">Item Name:</label>
                    <input type="text" id="manage-name" required>
                    <label for="manage-price">Price ($):</label>
                    <input type="number" id="manage-price" step="0.01" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('manage-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Item</button>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="/assets/js/app.js"></script>
</body>
</html>
